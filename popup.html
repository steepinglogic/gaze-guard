<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaze Guard</title>
  <style>
    :root {
      --bg: #16140f;
      --surface: #211e17;
      --surface-2: #2c2820;
      --border: #3a352a;
      --text: #ebe6d8;
      --text-dim: #9c9486;
      --accent: #c9a35b;
      --accent-dim: #8a7339;
      --green: #6fae5e;
      --red: #c66a5a;
      --amber: #d4a23c;
      --font: "Hiragino Sans", "Microsoft JhengHei", -apple-system, sans-serif;
      --mono: "SF Mono", "Consolas", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      padding: 18px;
      font-size: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    .title .sub {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
      letter-spacing: 0;
      margin-top: 2px;
    }
    .toggle-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .toggle-btn.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #16140f;
    }
    .toggle-btn:hover { border-color: var(--accent); }

    .status {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 13px;
    }
    .status-row .label { color: var(--text-dim); }
    .status-row .val { font-family: var(--mono); font-size: 13px; }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      background: var(--text-dim);
    }
    .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.red { background: var(--red); }
    .dot.amber { background: var(--amber); }

    .watch-bar {
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    .watch-fill {
      height: 100%;
      width: 0%;
      background: var(--amber);
      border-radius: 3px;
      transition: width 0.2s linear;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin: 16px 0 8px;
    }
    .field {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }
    .field label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .field label .num {
      color: var(--accent);
      font-family: var(--mono);
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
    }
    .row-2 { display: flex; gap: 10px; }
    .row-2 .field { flex: 1; }

    .color-row { display: flex; gap: 10px; }
    .color-swatch {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 2px solid var(--border);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, border-color 0.1s;
    }
    .color-swatch:hover { transform: scale(1.08); }
    .color-swatch.active {
      border-color: var(--text);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px currentColor;
    }

    .target-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .target-box .current {
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      word-break: break-all;
      margin-top: 4px;
      max-height: 32px;
      overflow: hidden;
    }
    .small-btn {
      border: 1px solid var(--accent-dim);
      background: transparent;
      color: var(--accent);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font);
      width: 100%;
      margin-top: 8px;
    }
    .small-btn:hover { background: var(--surface-2); }

    .hint {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-top: 4px;
    }
    .error {
      color: var(--red);
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .kofi-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      background: #29abe0;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }
    .kofi-btn:hover { background: #1f96c9; }
    .footer {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      Gaze Guard
      <span class="sub" data-i18n="popupSubtitle"></span>
    </div>
    <button id="toggle" class="toggle-btn" data-i18n="btnStart"></button>
  </div>

  <button id="kofi-btn" class="kofi-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
      <path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.011 3.976-4.011 3.976s-.121.119-.31.023c-.076-.057-.108-.09-.108-.09-.443-.441-3.368-3.049-4.034-3.954-.709-.965-1.041-2.7-.091-3.71.951-1.01 3.005-1.086 4.363.407 0 0 1.565-1.782 3.468-.963 1.904.82 1.832 3.011.723 4.311zm6.173.478c-.928.116-1.682.028-1.682.028V7.284h1.77s1.971.551 1.971 2.638c0 1.913-.985 2.667-2.059 3.015z"/>
    </svg>
    <span data-i18n="kofiSupport"></span>
  </button>

  <div class="status">
    <div class="status-row">
      <span class="label"><span id="state-dot" class="dot"></span><span data-i18n="labelStatus"></span></span>
      <span class="val" id="state-text" data-i18n="statusIdle"></span>
    </div>
    <div class="status-row">
      <span class="label" data-i18n="labelFace"></span>
      <span class="val" id="face-text">—</span>
    </div>
    <div class="status-row">
      <span class="label" data-i18n="labelDist"></span>
      <span class="val" id="dist-text">—</span>
    </div>
    <div class="status-row">
      <span class="label" data-i18n="labelAngle"></span>
      <span class="val" id="angle-text">—</span>
    </div>
    <div class="watch-bar"><div id="watch-fill" class="watch-fill"></div></div>
    <div class="error" id="error-box"></div>
  </div>

  <div class="section-title" data-i18n="sectionLanguage"></div>
  <div class="field">
    <select id="user-locale">
      <option value="auto" data-i18n="localeAuto"></option>
      <option value="zh_TW">繁體中文</option>
      <option value="en">English</option>
      <option value="zh_CN">简体中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>
  </div>

  <div class="section-title" data-i18n="sectionAction"></div>
  <div class="field">
    <select id="action-mode">
      <option value="notify_and_switch" data-i18n="optNotifyAndSwitch"></option>
      <option value="overlay_only" data-i18n="optOverlayOnly"></option>
      <option value="switch_only" data-i18n="optSwitchOnly"></option>
    </select>
  </div>

  <div class="section-title" data-i18n="sectionOverlayMode"></div>
  <div class="field">
    <select id="overlay-mode">
      <option value="border" data-i18n="optBorder"></option>
      <option value="marker" data-i18n="optMarker"></option>
    </select>
  </div>
  <div class="field" id="color-field">
    <label data-i18n="labelColorBorder"></label>
    <div class="color-row">
      <button class="color-swatch" data-color="#c9a35b" data-i18n-title="colorGold" style="background:#c9a35b"></button>
      <button class="color-swatch" data-color="#5dcaa5" data-i18n-title="colorTeal" style="background:#5dcaa5"></button>
      <button class="color-swatch" data-color="#e24b4a" data-i18n-title="colorRed" style="background:#e24b4a"></button>
    </div>
  </div>
  <div class="field">
    <label><span data-i18n="labelDuration"></span> <span class="num"><span id="duration-val">1500</span> ms</span></label>
    <input type="range" id="overlay-duration" min="500" max="5000" step="100" value="1500">
    <div class="hint" data-i18n="hintDuration"></div>
  </div>

  <div class="target-box">
    <div data-i18n="targetIntro"></div>
    <div class="current" id="target-current" data-i18n="targetUnset"></div>
    <button class="small-btn" id="set-target" data-i18n="btnSetTarget"></button>
  </div>

  <div class="section-title" data-i18n="sectionDetectParams"></div>
  <div class="field">
    <label><span data-i18n="labelExtraFace"></span> <span class="num"><span id="extra-face-val">1</span></span></label>
    <input type="range" id="extra-face" min="0" max="5" step="1" value="1">
    <div class="hint" data-i18n="hintExtraFace"></div>
  </div>
  <div class="field">
    <label><span data-i18n="labelTriggerDist"></span> <span class="num"><span id="dist-val">80</span> <span data-i18n="labelTriggerDistSuffix"></span></span></label>
    <input type="range" id="trigger-distance" min="40" max="150" step="5" value="80">
  </div>
  <div class="row-2">
    <div class="field">
      <label><span data-i18n="labelHold"></span> <span class="num"><span id="hold-val">2.5</span>s</span></label>
      <input type="range" id="hold-seconds" min="0.5" max="6" step="0.5" value="2.5">
    </div>
    <div class="field">
      <label><span data-i18n="labelCooldown"></span> <span class="num"><span id="cooldown-val">20</span>s</span></label>
      <input type="range" id="cooldown-seconds" min="1" max="60" step="1" value="20">
    </div>
  </div>
  <div class="field">
    <label><span data-i18n="labelYaw"></span> <span class="num">±<span id="yaw-val">22</span>°</span></label>
    <input type="range" id="yaw-threshold" min="8" max="40" step="2" value="22">
    <div class="hint" data-i18n="hintYaw"></div>
  </div>
  <div class="field">
    <label><span data-i18n="labelFocal"></span> <span class="num"><span id="focal-val">650</span> px</span></label>
    <input type="range" id="focal-length" min="400" max="1000" step="10" value="650">
    <div class="hint" data-i18n="hintFocal"></div>
  </div>

  <div class="footer" data-i18n="footerText"></div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
