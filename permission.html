<!DOCTYPE html>
<html lang="zh-Hant" data-i18n-doc-title="permPageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaze Guard</title>
  <style>
    :root {
      --bg: #16140f;
      --surface: #211e17;
      --border: #3a352a;
      --text: #ebe6d8;
      --text-dim: #9c9486;
      --accent: #c9a35b;
      --green: #6fae5e;
      --red: #c66a5a;
      --font: "Hiragino Sans", "Microsoft JhengHei", -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .eye {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
    .desc {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 24px;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .desc b { color: var(--accent); font-weight: 600; }
    button {
      background: var(--accent);
      color: #16140f;
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status {
      margin-top: 20px;
      font-size: 14px;
      min-height: 22px;
    }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    .hint {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.6;
      margin-top: 16px;
    }
    code {
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eye">👁</div>
    <h1>Gaze Guard</h1>
    <div class="sub" data-i18n="permSubtitle"></div>

<div class="desc" data-i18n-html="permDescHtml"></div>

    <button id="grant" data-i18n="permBtnGrant"></button>
    <div class="status" id="status"></div>

    <div class="hint" id="hint"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="permission.js"></script>
</body>
</html>
